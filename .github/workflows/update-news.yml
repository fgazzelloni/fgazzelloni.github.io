name: Refresh homepage news
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credential
        env:
          NEWS_DEPLOY_TOKEN: ${{ secrets.NEWS_DEPLOY_TOKEN }}
        run: test -n "$NEWS_DEPLOY_TOKEN" || { echo 'Set NEWS_DEPLOY_TOKEN before activating news updates.'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater
        run: python -m unittest discover -s scripts/tests -v
      - name: Check out published website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          token: ${{ secrets.NEWS_DEPLOY_TOKEN }}
      - name: Refresh published selection
        run: python scripts/update-news.py --output published/data/news.json
      - name: Embed headlines in published HTML
        run: python scripts/render-news.py --site published
      - name: Publish data and request Pages build
        working-directory: published
        env:
          GH_TOKEN: ${{ secrets.NEWS_DEPLOY_TOKEN }}
        run: |
          git add data/news.json index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh homepage news'
          git push origin HEAD:gh-pages
          # A token-authored push may already have queued the branch build.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" 2> build-error.txt; then
            if ! grep -q 'HTTP 409' build-error.txt; then
              cat build-error.txt
              exit 1
            fi
          fi
