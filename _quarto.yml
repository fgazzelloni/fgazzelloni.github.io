project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "about/**/*.qmd"
    - "content/**/*.qmd"
  resources:
    - data/news.json
    - scripts/news.js
  post-render:
    - scripts/normalize-sitemap.R

metadata-files:
  - _website.yml
  - _format.yml
  
execute:
  eval: false
  freeze: auto 
  
