project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "about/**/*.qmd"
    - "content/**/*.qmd"
  resources:
    - data/news.json
    - scripts/news.js
    - scripts/news.css
  post-render:
    - scripts/normalize-sitemap.R
    - python3 scripts/render-news.py

metadata-files:
  - _website.yml
  - _format.yml
  
execute:
  eval: false
  freeze: auto 
  
